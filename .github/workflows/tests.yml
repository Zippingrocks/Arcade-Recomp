name: ROM integrity tests
on:
  push:
  pull_request:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check original target and synthetic ROM wiring
        run: python -m unittest discover -s tests -v

      - name: Package ROM-free original source for reproducible local testing
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: arcaderecomp-source
          path: |
            arcaderecomp/
            runtime/
            tools/
            targets/
            tests/
          if-no-files-found: error
          retention-days: 3
