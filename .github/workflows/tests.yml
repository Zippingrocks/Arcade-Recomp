name: ROM integrity tests
on:
  push:
  pull_request:

jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check original target and synthetic ROM wiring
        run: python -m unittest discover -s tests -v
